version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=backend_db;Username=prod_user;Password=SuperSecurePassword!
      - JwtSettings__Secret=YOUR_VERY_SECURE_LONG_RANDOM_SECRET_KEY_HERE_12345!
      - JwtSettings__Issuer=NotesAndFileBackend
      - JwtSettings__Audience=NotesAndFileBackend.Users
    ports:
      - "5001:8080" # Maps the container's internal port to port 5001 on the host to avoid conflict
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: SuperSecurePassword!
      POSTGRES_DB: backend_db
    # We do NOT expose ports here to keep the DB internal and prevent conflicts with your other Postgres instance
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    
  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - /var/opt/pgbackups:/backups
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=backend_db
      - POSTGRES_USER=prod_user
      - POSTGRES_PASSWORD=SuperSecurePassword!
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080

volumes:
  postgres_data_prod:
