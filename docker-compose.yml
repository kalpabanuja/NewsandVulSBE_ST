services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=backend_db;Username=prod_user;Password=SuperSecurePassword!
      - JwtSettings__Secret=YOUR_VERY_SECURE_LONG_RANDOM_SECRET_KEY_HERE_12345!
      - JwtSettings__Issuer=NotesAndFileBackend
      - JwtSettings__Audience=NotesAndFileBackend.Users
      # MinIO / S3-compatible storage
      - Storage__ServiceUrl=http://minio:9000
      - Storage__AccessKey=minioadmin
      - Storage__SecretKey=minioadmin
      - Storage__BucketName=notesandfile-bucket
    ports:
      - "5001:8080"
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: SuperSecurePassword!
      POSTGRES_DB: backend_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    # Port 9001 exposes the MinIO web console — remove if you don't need it
    ports:
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    user: postgres:postgres 
    volumes:
      - /var/opt/pgbackups:/backups
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=backend_db
      - POSTGRES_USER=prod_user
      - POSTGRES_PASSWORD=SuperSecurePassword!
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080

volumes:
  postgres_data_prod:
  minio_data:
